name: probe

# What is the live origin actually serving right now?
#
# DEPLOY.md 2.5 asks for these checks by hand after a deploy. They are the ones
# that matter and they are easy to skip, and a stale edge or a header that did
# not take looks exactly like a working deploy from the inside. Run this from
# the Actions tab whenever the site disagrees with what was pushed.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Origin to probe
        default: https://rabaska.favreau.xyz
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: what the origin serves
        run: |
          URL="${{ inputs.url }}"
          echo "probing $URL"
          echo

          echo "=== build hash the origin is serving ==="
          LIVE=$(curl -sS --compressed "$URL/app.js" \
            | grep -o "const BUILD = '[0-9a-f]*'" | grep -o "[0-9a-f]\{16\}" | head -1)
          echo "  live app.js:  ${LIVE:-<none found>}"
          SW=$(curl -sS --compressed "$URL/sw.js" \
            | grep -o 'const BUILD = "[0-9a-f]*"' | grep -o "[0-9a-f]\{16\}" | head -1)
          echo "  live sw.js:   ${SW:-<none found>}"
          echo "  head of main: ${{ github.sha }}"
          echo

          echo "=== the two CSPs (DEPLOY.md 2.5) ==="
          echo "  page:"
          curl -sSI "$URL/" | grep -i '^content-security-policy' \
            | tr ';' '\n' | grep -iE 'connect-src|default-src' | sed 's/^/    /'
          echo "  worker:"
          curl -sSI "$URL/sw.js" | grep -i '^content-security-policy' \
            | tr ';' '\n' | grep -iE 'connect-src|default-src' | sed 's/^/    /'
          echo

          echo "=== caching, which is what makes a deploy look stuck ==="
          for f in / /sw.js /app.js /style.css; do
            printf '  %-12s ' "$f"
            curl -sSI "$URL$f" \
              | grep -iE '^(cache-control|age|cf-cache-status|etag|last-modified)' \
              | tr -d '\r' | paste -sd '; ' - | sed 's/^/ /'
            echo
          done

          echo "=== is the page even the same document? ==="
          curl -sSI "$URL/" | grep -iE '^(server|cf-ray|x-.*)' | tr -d '\r' | sed 's/^/  /'
