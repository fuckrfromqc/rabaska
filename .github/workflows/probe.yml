name: probe

# What is the live origin actually serving right now?
#
# DEPLOY.md 2.5 asks for these checks by hand after a deploy. They are the ones
# that matter and they are easy to skip, and a stale edge or a header that did
# not take looks exactly like a working deploy from the inside. Run this from
# the Actions tab whenever the site disagrees with what was pushed.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Origin to probe
        default: https://rabaska.favreau.xyz
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: what the origin serves
        run: tools/probe.sh "${{ inputs.url }}"
